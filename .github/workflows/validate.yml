name: Validate

on:
  push:
  pull_request:
  schedule:
    # Home Assistant releases monthly and hassfest tracks the current version,
    # so a weekly run catches breakage before a user does.
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Permanently ignored, not a pending task: since Home Assistant
          # 2026.3 the brands repository no longer accepts icons for custom
          # integrations, because they serve their own from the brand/
          # directory. A submission there would be closed on sight, so this
          # check can never pass and never needs to.
          # https://developers.home-assistant.io/blog/2026/02/24/brands-proxy-api
          ignore: brands

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check .

  tests:
    name: pytest on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_test.txt
      - run: pytest -q
