name: Release

on:
  push:
    tags:
      - "v*"

# The automatic GITHUB_TOKEN of this run is all that is needed to publish a
# release. No personal access token is stored anywhere for this.
permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a tag that disagrees with the manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/onntrack/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest."
            echo "::error::HACS matches releases against the manifest, so this release would never be offered as an update."
            exit 1
          fi

      - name: Take the release notes from the changelog
        run: |
          set -euo pipefail
          python3 scripts/changelog_section.py "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
