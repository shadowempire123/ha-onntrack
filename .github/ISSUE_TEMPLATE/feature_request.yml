name: Feature request
description: Suggest something the integration should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        The problem rather than the solution, please. The portal exposes more
        than this integration surfaces, so knowing the goal often turns up a
        simpler route.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
