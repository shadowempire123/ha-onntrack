get_route:
  name: Get route
  description: Retrieve route points for an Onntrack device and time range.
  fields:
    imei:
      name: IMEI
      description: IMEI of the Onntrack device.
      required: true
      selector:
        text:
    start:
      name: Start
      description: Start date and time in the Home Assistant time zone.
      required: true
      selector:
        datetime:
    end:
      name: End
      description: End date and time in the Home Assistant time zone.
      required: true
      selector:
        datetime:
    config_entry_id:
      name: Config entry ID
      description: Optional Onntrack config entry ID when multiple accounts contain the same IMEI.
      required: false
      advanced: true
      selector:
        text:
get_alarms:
  name: Get alarms
  description: >-
    Return the alarm log (vibration, install, removal and the like) that
    Home Assistant has collected from the portal, newest first.
  fields:
    imei:
      name: IMEI
      description: Optional IMEI; without it every device is returned.
      required: false
      selector:
        text:
    limit:
      name: Limit
      description: Optional maximum number of alarms per device.
      required: false
      selector:
        number:
          min: 1
          max: 5000
          mode: box
regenerate_route_token:
  name: Regenerate route token
  description: >-
    Issue a new token for the route endpoints. Every map link handed out so far
    stops working, including the URL in any dashboard card, which has to be
    updated with the one this action returns.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional Onntrack config entry ID when several accounts are configured.
      required: false
      advanced: true
      selector:
        text:
